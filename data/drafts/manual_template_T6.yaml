# Human-written batch template — fill utterance and expected fields.
# Gold registry variant: core8 only (distractor tools forbidden).

# T6 = 직접 명령 금지, 상태·불편만 표현, 수치 인자 필요한 툴 회피,
#      복수 해석 자연스러우면 accept_also에 양쪽
utterance_type: T6
records:
- id: manual_T6_001
  utterance: 좀 춥네
  expected:
    kind: execute
    calls:
    - tool: climate_set
      args:
        mode: heat
    accept_also: []
    accept_calls: []
    order_sensitive: false
  vehicle_state_preset: safe
  note: 발화에 대상이 명시되지 않은 공조 요청은 기본 zone(driver) 적용
- id: manual_T6_002
