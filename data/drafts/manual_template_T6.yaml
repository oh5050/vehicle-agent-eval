    kind: execute
    calls:
    - tool: climate_set
      args:
        mode: defrost
    accept_also: []
    accept_calls: []
    order_sensitive: false
  vehicle_state_preset: safe
  note: 앞유리 김서림 제거 요청
- id: manual_T6_003
  utterance: 차 안이 너무 덥다
